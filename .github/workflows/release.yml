name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: "app,dmg"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: "app,dmg"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY,无法生成 updater 签名产物"
            exit 1
          fi
          echo "已配置 TAURI_SIGNING_PRIVATE_KEY,updater 产物将带 .sig"

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Check versions
        shell: bash
        run: uv run python scripts/check_versions.py --tag "${GITHUB_REF_NAME}"

      - name: Build Python sidecar
        shell: bash
        run: |
          uv run python packaging/build_sidecar.py --target "${{ matrix.target }}"

      # macOS 签名/公证全部可选:只有对应 secrets 存在时才导入证书并交给 Tauri。
      # 未配置时构建仍会产出未签名(或 ad-hoc 签名)的 .app,不声称已签名/公证。
      - name: Import Apple certificate (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE 未配置,跳过导入;本次 macOS 产物不做 Developer ID 签名/公证"
            exit 0
          fi
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::APPLE_CERTIFICATE 已配置但 APPLE_SIGNING_IDENTITY 为空,本次不做 Developer ID 签名"
          fi
          keychain_password="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
          certificate_path="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$certificate_path" \
            -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain
          security list-keychains -d user -s build.keychain

          # 只导出非空变量,避免 Tauri 把空字符串当成"已配置"而尝试签名/公证
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          done

      # Windows Authenticode 代码签名预留说明(当前不签名,也不伪造 .sig):
      # - 证书 secrets 建议命名 WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
      # - 在 src-tauri/tauri.conf.json 的 bundle.windows.certificateThumbprint
      #   或 bundle.windows.signCommand 中启用签名
      # - updater 的 .sig 由 TAURI_SIGNING_PRIVATE_KEY 生成,与 Windows 代码签名无关
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri -- build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Polish macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmgs=(src-tauri/target/"${{ matrix.target }}"/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::期望 1 个 DMG,实际 ${#dmgs[@]} 个"
            exit 1
          fi
          python packaging/polish_dmg.py "${dmgs[0]}"

      # 统一命名,让 manifest 能明确区分平台/架构:
      #   NewsPaperCrawl_<version>_<triple>-setup.exe(+.sig)    Windows NSIS
      #   NewsPaperCrawl_<version>_<triple>.app.tar.gz(+.sig)   macOS updater
      #   NewsPaperCrawl_<version>_<triple>.dmg                 macOS 安装包
      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          bundle_dir="src-tauri/target/${target}/release/bundle"
          mkdir -p dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            installers=("$bundle_dir"/nsis/*-setup.exe)
            if [ "${#installers[@]}" -ne 1 ]; then
              echo "::error::期望 1 个 NSIS setup.exe,实际 ${#installers[@]} 个"
              exit 1
            fi
            installer="${installers[0]}"
            if [ ! -f "${installer}.sig" ]; then
              echo "::error::缺少 updater 签名 ${installer}.sig"
              exit 1
            fi
            cp "$installer" "dist/NewsPaperCrawl_${version}_${target}-setup.exe"
            cp "${installer}.sig" "dist/NewsPaperCrawl_${version}_${target}-setup.exe.sig"
          else
            updaters=("$bundle_dir"/macos/*.app.tar.gz)
            if [ "${#updaters[@]}" -ne 1 ]; then
              echo "::error::期望 1 个 .app.tar.gz,实际 ${#updaters[@]} 个"
              exit 1
            fi
            updater="${updaters[0]}"
            if [ ! -f "${updater}.sig" ]; then
              echo "::error::缺少 updater 签名 ${updater}.sig"
              exit 1
            fi
            cp "$updater" "dist/NewsPaperCrawl_${version}_${target}.app.tar.gz"
            cp "${updater}.sig" "dist/NewsPaperCrawl_${version}_${target}.app.tar.gz.sig"

            dmgs=("$bundle_dir"/dmg/*.dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "::error::期望 1 个 .dmg,实际 ${#dmgs[@]} 个"
              exit 1
            fi
            cp "${dmgs[0]}" "dist/NewsPaperCrawl_${version}_${target}.dmg"
          fi

          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes_file" || true
          if [ ! -s "$notes_file" ]; then
            printf 'NewsPaperCrawl %s\n' "$GITHUB_REF_NAME" > "$notes_file"
          fi

          python packaging/build_update_manifest.py \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --artifacts artifacts \
            --notes-file "$notes_file" \
            --output artifacts/latest.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/latest.json").read_text(encoding="utf-8"))
          expected = {"windows-x86_64", "darwin-aarch64", "darwin-x86_64"}
          missing = expected - set(manifest["platforms"])
          if missing:
              raise SystemExit(f"latest.json 缺少平台: {sorted(missing)}")
          print(f"latest.json version={manifest['version']} platforms={sorted(manifest['platforms'])}")
          for name in sorted(os.listdir("artifacts")):
              print("asset:", name)
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NewsPaperCrawl ${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
